<!--
  Home Privacy Cleanup email signature.
  Table-based with inline styles so it survives Gmail, Outlook, and Apple Mail.
  The logo mark is served from public/email/hpc-mark.png, so it only appears
  once that file is deployed to homeprivacycleanup.com.
  To install: open this file in a browser, select everything from the name
  through the button, copy, and paste into the mail client's signature editor.
-->
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c2623;">
  <tr>
    <!-- Left rule: evergreen bar with a clay foot -->
    <td valign="top" style="padding:0 18px 0 0;">
      <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;height:100%;">
        <tr><td width="4" height="150" style="width:4px;height:150px;background:#1f4a3d;font-size:0;line-height:0;">&nbsp;</td></tr>
        <tr><td width="4" height="6" style="width:4px;height:6px;background:#b5643a;font-size:0;line-height:0;">&nbsp;</td></tr>
      </table>
    </td>
    <td valign="top" style="padding:0;">
      <!-- Name -->
      <div style="font-family:Fraunces,Georgia,'Times New Roman',serif;font-size:26px;line-height:30px;font-weight:400;color:#1c2623;">Matt LaFleur, CPA</div>
      <!-- Brand line -->
      <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;margin:8px 0 6px 0;">
        <tr>
          <td valign="middle" style="padding:0 8px 0 0;"><img src="https://homeprivacycleanup.com/email/hpc-mark.png" width="22" height="22" alt="" style="display:block;width:22px;height:22px;border:0;"></td>
          <td valign="middle" style="font-family:Fraunces,Georgia,'Times New Roman',serif;font-size:19px;line-height:22px;font-weight:400;color:#1f4a3d;">Home Privacy <span style="color:#8a4421;">Cleanup</span></td>
        </tr>
      </table>
      <!-- Tagline -->
      <div style="font-size:13px;line-height:18px;color:#4c5a55;">Listing photo removal for Northeast Ohio homeowners</div>
      <!-- Contact -->
      <div style="font-size:13px;line-height:18px;margin:8px 0 10px 0;">
        <a href="https://homeprivacycleanup.com" style="color:#1c2623;font-weight:600;text-decoration:none;">homeprivacycleanup.com</a>
        <span style="color:#b9ad97;padding:0 6px;">|</span>
        <a href="mailto:hello@homeprivacycleanup.com" style="color:#1c2623;text-decoration:none;">hello@homeprivacycleanup.com</a>
      </div>
      <!-- Button -->
      <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;">
        <tr>
          <td bgcolor="#1f4a3d" style="background:#1f4a3d;border-radius:6px;padding:7px 14px;">
            <a href="https://homeprivacycleanup.com/start" style="font-size:13px;line-height:16px;font-weight:600;color:#f8f3ea;text-decoration:none;white-space:nowrap;"><span style="color:#d98a5f;">&#9679;</span>&nbsp; Check if my home qualifies</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
